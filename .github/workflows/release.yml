name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pack
        uses: actions/checkout@v4

      # packwiz publishes no release binaries; its CI artifacts ARE the prebuilt
      # binaries (her pointer, 22:0xZ). Download the latest green Linux artifact;
      # go-install fallback (pinned) if upstream renames workflows/artifacts or
      # artifacts expire. Runner image ships a Go toolchain, so the fallback
      # needs no setup-go step.
      - name: Resolve packwiz (upstream CI artifact, go-install fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN=""
          RUN_ID=$(gh api "repos/packwiz/packwiz/actions/runs?status=success&per_page=15" \
            --jq '[.workflow_runs[] | select(.name == "Go" and .head_branch == "main")][0].id' || true)
          if [ -n "${RUN_ID:-}" ] && [ "$RUN_ID" != "null" ]; then
            ART_ID=$(gh api "repos/packwiz/packwiz/actions/runs/$RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "Linux 64-bit x86")][0].id' || true)
            if [ -n "${ART_ID:-}" ] && [ "$ART_ID" != "null" ]; then
              mkdir -p "$RUNNER_TEMP/pw"
              gh api "repos/packwiz/packwiz/actions/artifacts/$ART_ID/zip" > "$RUNNER_TEMP/pw/pw.zip"
              unzip -q "$RUNNER_TEMP/pw/pw.zip" -d "$RUNNER_TEMP/pw"
              chmod +x "$RUNNER_TEMP/pw/packwiz"
              BIN="$RUNNER_TEMP/pw/packwiz"
              echo "packwiz source: upstream CI artifact (run $RUN_ID)"
            fi
          fi
          if [ -z "$BIN" ]; then
            echo "artifact route unavailable — falling back to go install (pinned 170b22d7)"
            echo "$HOME/go/bin" >> "$GITHUB_PATH"
            go install github.com/packwiz/packwiz@170b22d785959dda5876b54b7f16e1b807a57fb6
            BIN="$HOME/go/bin/packwiz"
          fi
          "$BIN" --help > /dev/null
          echo "PW_BIN=$BIN" >> "$GITHUB_ENV"

      # NOTE: both exports run `index.Refresh()` internally — the working dir's
      # index.toml/pack.toml get upgraded to a FULL index in this workspace
      # (repo stays mods-only). The raw packwiz zip below is therefore built
      # from the post-refresh state and is installer-functional by design.
      # Order matters: cf export warms the packwiz download cache, mr export
      # reuses it, raw zip ships the refreshed index.

      - name: Export CurseForge zip
        run: ${PW_BIN} cf export --output "minebricks-cf-${GITHUB_REF_NAME}.zip"

      - name: Export Modrinth mrpack
        run: ${PW_BIN} mr export --output "minebricks-mr-${GITHUB_REF_NAME}.mrpack"

      - name: Pack raw packwiz zip
        run: |
          zip -r "minebricks-packwiz-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' '.github/*' 'tools/*' '*.md' \
               'GROWTH-DIALS.json' 'WORLDGEN-SOURCES.json' \
               'kubejs/export/*' '.packwizignore' \
               '*.zip' '*.mrpack' 'packwiz*'

      - name: Checksums
        run: sha256sum minebricks-* > SHA256SUMS.txt

      - name: Attach dry-run artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pack-outputs-${{ github.run_id }}
          path: |
            minebricks-*
            SHA256SUMS.txt

      - name: Publish GitHub Release (tag runs)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Minebricks ${{ github.ref_name }}
          body: |
            **${{ github.ref_name }}** — Minecraft 1.21.1 · NeoForge 21.1.265 · 57 mods

            | File | Use |
            |---|---|
            | `minebricks-mr-*.mrpack` | Modrinth App / Prism — import directly |
            | `minebricks-cf-*.zip` | CurseForge launcher — import as profile |
            | `minebricks-packwiz-*.zip` | Raw packwiz pack — `packwiz install` / manual |

            `SHA256SUMS.txt` covers all artifacts. Built by packwiz from the tagged
            packwiz pack — reproducible from the tag. Modrinth-only mods ride
            `overrides/mods/` inside the CF zip (CurseForge can't reference them);
            everything else identical across formats.

            **Auto-updating install (recommended):** drop
            [packwiz-installer-bootstrap.jar](https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar)
            into the instance folder and set the pre-launch command
            `"$INST_JAVA" -jar packwiz-installer-bootstrap.jar https://deveyus.github.io/minebricks/pack.toml`
            — installs then track the live pack on every launch. Servers: `java -jar packwiz-installer-bootstrap.jar -g -s server https://deveyus.github.io/minebricks/pack.toml`.
          files: |
            minebricks-cf-*.zip
            minebricks-mr-*.mrpack
            minebricks-packwiz-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
