name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pack
        uses: actions/checkout@v4

      # packwiz publishes no release binaries; its CI artifacts ARE the prebuilt
      # binaries (her pointer, 22:0xZ). Download the latest green Linux artifact;
      # go-install fallback (pinned) if upstream renames workflows/artifacts or
      # artifacts expire. Runner image ships a Go toolchain, so the fallback
      # needs no setup-go step.
      - name: Resolve packwiz (upstream CI artifact, go-install fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN=""
          RUN_ID=$(gh api "repos/packwiz/packwiz/actions/runs?status=success&per_page=15" \
            --jq '[.workflow_runs[] | select(.name == "Go" and .head_branch == "main")][0].id' || true)
          if [ -n "${RUN_ID:-}" ] && [ "$RUN_ID" != "null" ]; then
            ART_ID=$(gh api "repos/packwiz/packwiz/actions/runs/$RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "Linux 64-bit x86")][0].id' || true)
            if [ -n "${ART_ID:-}" ] && [ "$ART_ID" != "null" ]; then
              mkdir -p "$RUNNER_TEMP/pw"
              gh api "repos/packwiz/packwiz/actions/artifacts/$ART_ID/zip" > "$RUNNER_TEMP/pw/pw.zip"
              unzip -q "$RUNNER_TEMP/pw/pw.zip" -d "$RUNNER_TEMP/pw"
              chmod +x "$RUNNER_TEMP/pw/packwiz"
              BIN="$RUNNER_TEMP/pw/packwiz"
              echo "packwiz source: upstream CI artifact (run $RUN_ID)"
            fi
          fi
          if [ -z "$BIN" ]; then
            echo "artifact route unavailable — falling back to go install (pinned 170b22d7)"
            echo "$HOME/go/bin" >> "$GITHUB_PATH"
            go install github.com/packwiz/packwiz@170b22d785959dda5876b54b7f16e1b807a57fb6
            BIN="$HOME/go/bin/packwiz"
          fi
          "$BIN" --help > /dev/null
          echo "PW_BIN=$BIN" >> "$GITHUB_ENV"

      # Ruling 23:34Z (her): "we kill the releases that do not support it" —
      # mrpack + CF zip are gone; the bootstrapper/Pages route is THE route.
      # The only artifact is the raw packwiz pack. refresh() upgrades the
      # workspace index to FULL in-place, so the zip is installer-functional
      # by design. No jar downloads happen at all — CI runs in seconds.

      - name: Refresh index
        run: ${PW_BIN} refresh

      - name: Pack raw packwiz zip
        run: |
          zip -r "minebricks-packwiz-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' '.github/*' 'tools/*' '*.md' \
               'GROWTH-DIALS.json' 'WORLDGEN-SOURCES.json' \
               'kubejs/export/*' '.packwizignore' \
               '*.zip' '*.mrpack' 'packwiz*'

      - name: Checksums
        run: sha256sum minebricks-* > SHA256SUMS.txt

      - name: Attach dry-run artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pack-outputs-${{ github.run_id }}
          path: |
            minebricks-*
            SHA256SUMS.txt

      - name: Publish GitHub Release (tag runs)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Minebricks ${{ github.ref_name }}
          body: |
            **${{ github.ref_name }}** — Minecraft 1.21.1 · NeoForge 21.1.265 · 57 mods

            ### Install (and auto-update) — packwiz bootstrapper

            1. Create an instance in Prism/MultiMC (MC version doesn't matter — the installer sets it).
            2. Drop [packwiz-installer-bootstrap.jar](https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar) into the instance root.
            3. Instance Settings → Custom commands → Pre-launch command:

               ```
               "$INST_JAVA" -jar packwiz-installer-bootstrap.jar --multimc-folder . https://deveyus.github.io/minebricks/pack.toml
               ```

            4. Launch. First run installs everything — 57 mods, scripts, config — and sets MC 1.21.1 + NeoForge 21.1.265 itself (accept the version prompt). Every later launch silently re-syncs to the latest pack.

            Dedicated servers: `java -jar packwiz-installer-bootstrap.jar -g -s server https://deveyus.github.io/minebricks/pack.toml` in the server directory.

            `minebricks-packwiz-*.zip` is the raw packwiz pack — reference and manual/server installs. `SHA256SUMS.txt` covers it. Built by packwiz from the tag, reproducible; the same bytes ship live on Pages (pack.toml → index → every file sha256/sha512-pinned).
          files: |
            minebricks-packwiz-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
